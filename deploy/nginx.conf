# Updated Nginx Configuration for Distributed Event-Driven System
# Supports: API Backend, WebSocket, Load Balancing
# 
# Copy this file to /etc/nginx/sites-available/base-backend
# Then link: sudo ln -s /etc/nginx/sites-available/base-backend /etc/nginx/sites-enabled/
# Then restart: sudo systemctl restart nginx

# ============================================================================
# RATE LIMITING ZONES (DDoS Protection)
# ============================================================================

# Standard API rate limit: 10 requests per second
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Socket.IO rate limit: 50 requests per second (higher for real-time)
limit_req_zone $binary_remote_addr zone=socket_limit:10m rate=50r/s;

# ============================================================================
# UPSTREAM SERVERS (Backend Services)
# ============================================================================

upstream backend_server {
    server backend:4000;
}

# ============================================================================
# HTTP SERVER (Main Development Configuration)
# ============================================================================

server {
    listen 80;
    server_name localhost 127.0.0.1;

    # ========================================================================
    # MAIN API ROUTES (Backend Service)
    # ========================================================================
    
    location / {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ========================================================================
    # SOCKET.IO ROUTES (Real-time Communication)
    # ========================================================================
    
    location /socket.io/ {
        limit_req zone=socket_limit burst=100 nodelay;

        proxy_pass http://backend_server;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Support (Critical for Socket.IO)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        # Long timeouts for persistent connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;

        # Disable buffering for real-time data
        proxy_buffering off;
    }

    # ========================================================================
    # HEALTH CHECK ENDPOINT
    # ========================================================================
    
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
